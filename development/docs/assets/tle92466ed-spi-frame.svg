<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t-spi d-spi">
  <title id="t-spi">TLE92466ED 32-bit SPI frame format &#8212; MOSI and MISO</title>
  <desc id="d-spi">Diagram showing the 32-bit SPI frame structure for MOSI write, MOSI read, MISO reply (mode 00), and MISO critical fault (mode 10) frames used by the TLE92466ED low-side driver.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .frame    { fill: #f4f6f8; stroke: #1a365d; stroke-width: 1.5; }
      .field-crc{ fill: #ebf4ff; stroke: #2c5282; stroke-width: 1.2; }
      .field-addr{fill: #f0fff4; stroke: #276749; stroke-width: 1.2; }
      .field-rw { fill: #fef5e7; stroke: #c05621; stroke-width: 1.2; }
      .field-data{fill: #fff5f5; stroke: #c53030; stroke-width: 1.2; }
      .field-stat{fill: #faf5ff; stroke: #6b46c1; stroke-width: 1.2; }
      .field-fault{fill: #fed7d7; stroke: #c53030; stroke-width: 1.2; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 10px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 10px; fill: #4a5568; text-anchor: start; }
      .bit      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 10px; fill: #1a202c; text-anchor: middle; }
      .bitL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 10px; fill: #1a202c; text-anchor: start; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
  </defs>
  <rect class="panel" width="900" height="540"/>

  <text class="head" x="450" y="24">TLE92466ED &#8212; 32-bit SPI frame format</text>

  <!-- ========================================================= -->
  <!-- Row 1: MOSI Write Frame   y=38..88  (box y=50, h=30)     -->
  <!-- x0=162, 18px/bit, total 576px, x1=738                    -->
  <!-- Fields: CRC[31:24]=144, Addr[23:17]=126, RW[16]=18, Data[15:0]=288 -->
  <!-- ========================================================= -->
  <g>
    <text class="title" x="44" y="69">MOSI Write</text>
    <!-- CRC [31:24] -->
    <rect class="field-crc" x="162" y="50" width="144" height="30" rx="3"/>
    <text class="bit" x="234" y="62">CRC</text>
    <text class="small" x="234" y="74">[31:24]</text>
    <!-- Address [23:17] -->
    <rect class="field-addr" x="306" y="50" width="126" height="30" rx="3"/>
    <text class="bit" x="369" y="62">Address</text>
    <text class="small" x="369" y="74">[23:17]</text>
    <!-- R/W [16] = W -->
    <rect class="field-rw" x="432" y="50" width="18" height="30" rx="2"/>
    <text class="bit" x="441" y="69">W</text>
    <!-- Data [15:0] -->
    <rect class="field-data" x="450" y="50" width="288" height="30" rx="3"/>
    <text class="bit" x="594" y="62">Data</text>
    <text class="small" x="594" y="74">[15:0]</text>
    <!-- Bit ticks -->
    <text class="small" x="162" y="92">31</text>
    <text class="small" x="306" y="92">23</text>
    <text class="small" x="432" y="92">16</text>
    <text class="small" x="450" y="92">15</text>
    <text class="small" x="594" y="92">8</text>
    <text class="small" x="738" y="92">0</text>
    <!-- tick marks -->
    <line stroke="#718096" stroke-width="0.7" x1="162" y1="80" x2="162" y2="85"/>
    <line stroke="#718096" stroke-width="0.7" x1="306" y1="80" x2="306" y2="85"/>
    <line stroke="#718096" stroke-width="0.7" x1="432" y1="80" x2="432" y2="85"/>
    <line stroke="#718096" stroke-width="0.7" x1="450" y1="80" x2="450" y2="85"/>
    <line stroke="#718096" stroke-width="0.7" x1="594" y1="80" x2="594" y2="85"/>
    <line stroke="#718096" stroke-width="0.7" x1="738" y1="80" x2="738" y2="85"/>
  </g>

  <!-- ========================================================= -->
  <!-- Row 2: MOSI Read Frame   y=100..150  (box y=112, h=30)   -->
  <!-- CRC[31:24]=144, Don't Care[23:17]=126, RW=R[16]=18, Addr[15:0]=288 -->
  <!-- ========================================================= -->
  <g>
    <text class="title" x="44" y="131">MOSI Read</text>
    <!-- CRC [31:24] -->
    <rect class="field-crc" x="162" y="112" width="144" height="30" rx="3"/>
    <text class="bit" x="234" y="124">CRC</text>
    <text class="small" x="234" y="136">[31:24]</text>
    <!-- Don't Care [23:17] -->
    <rect class="frame" x="306" y="112" width="126" height="30" rx="3"/>
    <text class="bit" x="369" y="124">Don&#39;t Care</text>
    <text class="small" x="369" y="136">[23:17]</text>
    <!-- R/W [16] = R -->
    <rect class="field-rw" x="432" y="112" width="18" height="30" rx="2"/>
    <text class="bit" x="441" y="131">R</text>
    <!-- Address [15:0] -->
    <rect class="field-addr" x="450" y="112" width="288" height="30" rx="3"/>
    <text class="bit" x="594" y="124">Address</text>
    <text class="small" x="594" y="136">[15:0]</text>
    <!-- Bit ticks -->
    <text class="small" x="162" y="154">31</text>
    <text class="small" x="306" y="154">23</text>
    <text class="small" x="432" y="154">16</text>
    <text class="small" x="450" y="154">15</text>
    <text class="small" x="594" y="154">8</text>
    <text class="small" x="738" y="154">0</text>
    <line stroke="#718096" stroke-width="0.7" x1="162" y1="142" x2="162" y2="147"/>
    <line stroke="#718096" stroke-width="0.7" x1="306" y1="142" x2="306" y2="147"/>
    <line stroke="#718096" stroke-width="0.7" x1="432" y1="142" x2="432" y2="147"/>
    <line stroke="#718096" stroke-width="0.7" x1="450" y1="142" x2="450" y2="147"/>
    <line stroke="#718096" stroke-width="0.7" x1="594" y1="142" x2="594" y2="147"/>
    <line stroke="#718096" stroke-width="0.7" x1="738" y1="142" x2="738" y2="147"/>
  </g>

  <!-- ========================================================= -->
  <!-- Row 3: MISO Reply (mode 00)  y=162..212 (box y=174, h=30)-->
  <!-- CRC[31:24]=144, ReplyMode[23:22]=36, Status[21:17]=90,   -->
  <!-- RW echo[16]=18, Data[15:0]=288                            -->
  <!-- ========================================================= -->
  <g>
    <text class="title" x="44" y="187">MISO Reply</text>
    <text class="smallL" x="44" y="199">(mode 00)</text>
    <!-- CRC [31:24] -->
    <rect class="field-crc" x="162" y="174" width="144" height="30" rx="3"/>
    <text class="bit" x="234" y="186">CRC</text>
    <text class="small" x="234" y="198">[31:24]</text>
    <!-- Reply Mode [23:22] = 00 -->
    <rect class="field-stat" x="306" y="174" width="36" height="30" rx="3"/>
    <text class="bit" x="324" y="186">RM</text>
    <text class="small" x="324" y="198">00</text>
    <!-- Status [21:17] -->
    <rect class="field-stat" x="342" y="174" width="90" height="30" rx="3"/>
    <text class="bit" x="387" y="186">Status</text>
    <text class="small" x="387" y="198">[21:17]</text>
    <!-- R/W echo [16] -->
    <rect class="field-rw" x="432" y="174" width="18" height="30" rx="2"/>
    <text class="bit" x="441" y="186">R</text>
    <text class="small" x="441" y="198">/W</text>
    <!-- Data [15:0] -->
    <rect class="field-data" x="450" y="174" width="288" height="30" rx="3"/>
    <text class="bit" x="594" y="186">Data</text>
    <text class="small" x="594" y="198">[15:0]</text>
    <!-- Bit ticks -->
    <text class="small" x="162" y="216">31</text>
    <text class="small" x="306" y="216">23</text>
    <text class="small" x="342" y="216">21</text>
    <text class="small" x="432" y="216">16</text>
    <text class="small" x="450" y="216">15</text>
    <text class="small" x="738" y="216">0</text>
    <line stroke="#718096" stroke-width="0.7" x1="162" y1="204" x2="162" y2="209"/>
    <line stroke="#718096" stroke-width="0.7" x1="306" y1="204" x2="306" y2="209"/>
    <line stroke="#718096" stroke-width="0.7" x1="342" y1="204" x2="342" y2="209"/>
    <line stroke="#718096" stroke-width="0.7" x1="432" y1="204" x2="432" y2="209"/>
    <line stroke="#718096" stroke-width="0.7" x1="450" y1="204" x2="450" y2="209"/>
    <line stroke="#718096" stroke-width="0.7" x1="738" y1="204" x2="738" y2="209"/>
  </g>

  <!-- ========================================================= -->
  <!-- Row 4: MISO Critical Fault (mode 10)  y=224..274          -->
  <!-- (box y=236, h=30)                                          -->
  <!-- Don't Care[31:24]=144, ReplyMode[23:22]=36,               -->
  <!-- Don't Care[21:8]=252, Fault Flags[7:0]=144                -->
  <!-- ========================================================= -->
  <g>
    <text class="title" x="44" y="249">MISO Fault</text>
    <text class="smallL" x="44" y="261">(mode 10)</text>
    <!-- Don't Care [31:24] -->
    <rect class="frame" x="162" y="236" width="144" height="30" rx="3"/>
    <text class="bit" x="234" y="248">Don&#39;t Care</text>
    <text class="small" x="234" y="260">[31:24]</text>
    <!-- Reply Mode [23:22] = 10 -->
    <rect class="field-stat" x="306" y="236" width="36" height="30" rx="3"/>
    <text class="bit" x="324" y="248">RM</text>
    <text class="small" x="324" y="260">10</text>
    <!-- Don't Care [21:8] -->
    <rect class="frame" x="342" y="236" width="252" height="30" rx="3"/>
    <text class="bit" x="468" y="248">Don&#39;t Care</text>
    <text class="small" x="468" y="260">[21:8]</text>
    <!-- Fault Flags [7:0] -->
    <rect class="field-fault" x="594" y="236" width="144" height="30" rx="3"/>
    <text class="bit" x="666" y="248">Fault Flags</text>
    <text class="small" x="666" y="260">[7:0]</text>
    <!-- Bit ticks -->
    <text class="small" x="162" y="278">31</text>
    <text class="small" x="306" y="278">23</text>
    <text class="small" x="342" y="278">21</text>
    <text class="small" x="594" y="278">7</text>
    <text class="small" x="738" y="278">0</text>
    <line stroke="#718096" stroke-width="0.7" x1="162" y1="266" x2="162" y2="271"/>
    <line stroke="#718096" stroke-width="0.7" x1="306" y1="266" x2="306" y2="271"/>
    <line stroke="#718096" stroke-width="0.7" x1="342" y1="266" x2="342" y2="271"/>
    <line stroke="#718096" stroke-width="0.7" x1="594" y1="266" x2="594" y2="271"/>
    <line stroke="#718096" stroke-width="0.7" x1="738" y1="266" x2="738" y2="271"/>
  </g>

  <!-- ========================================================= -->
  <!-- Fault Flags bit decode (below Row 4)                      -->
  <!-- 8 individual bit boxes, each 18px wide, from x=594..738   -->
  <!-- ========================================================= -->
  <g>
    <text class="title" x="594" y="300">Fault Flag decode [7:0]</text>
    <!-- bit 7 -->
    <rect class="field-fault" x="594" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="603" y="320">7</text>
    <!-- bit 6 -->
    <rect class="field-fault" x="612" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="621" y="320">6</text>
    <!-- bit 5 -->
    <rect class="field-fault" x="630" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="639" y="320">5</text>
    <!-- bit 4 -->
    <rect class="field-fault" x="648" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="657" y="320">4</text>
    <!-- bit 3 -->
    <rect class="field-fault" x="666" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="675" y="320">3</text>
    <!-- bit 2 -->
    <rect class="field-fault" x="684" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="693" y="320">2</text>
    <!-- bit 1 -->
    <rect class="field-fault" x="702" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="711" y="320">1</text>
    <!-- bit 0 -->
    <rect class="field-fault" x="720" y="306" width="18" height="22" rx="2"/>
    <text class="bit" x="729" y="320">0</text>
    <!-- Rotated labels -->
    <text class="bitL" transform="translate(607,332) rotate(50)" x="0" y="0">1V5_OK</text>
    <text class="bitL" transform="translate(625,332) rotate(50)" x="0" y="0">2V5_OK</text>
    <text class="bitL" transform="translate(643,332) rotate(50)" x="0" y="0">ADC_BG</text>
    <text class="bitL" transform="translate(661,332) rotate(50)" x="0" y="0">CLK_SLOW</text>
    <text class="bitL" transform="translate(679,332) rotate(50)" x="0" y="0">CLK_FAST</text>
    <text class="bitL" transform="translate(697,332) rotate(50)" x="0" y="0">DCLK_SLOW</text>
    <text class="bitL" transform="translate(715,332) rotate(50)" x="0" y="0">DCLK_FAST</text>
    <text class="bitL" transform="translate(733,332) rotate(50)" x="0" y="0">WD_REF</text>
  </g>

  <!-- Tick lines from bit boxes to labels -->
  <g stroke="#c53030" stroke-width="0.6" fill="none">
    <line x1="603" y1="328" x2="603" y2="332"/>
    <line x1="621" y1="328" x2="621" y2="332"/>
    <line x1="639" y1="328" x2="639" y2="332"/>
    <line x1="657" y1="328" x2="657" y2="332"/>
    <line x1="675" y1="328" x2="675" y2="332"/>
    <line x1="693" y1="328" x2="693" y2="332"/>
    <line x1="711" y1="328" x2="711" y2="332"/>
    <line x1="729" y1="328" x2="729" y2="332"/>
  </g>

  <!-- ========================================================= -->
  <!-- Legend                                                     -->
  <!-- ========================================================= -->
  <g transform="translate(44, 400)">
    <text class="title" x="0" y="0">Legend</text>

    <!-- Row 1 -->
    <rect class="field-crc" x="0" y="10" width="14" height="14" rx="2"/>
    <text class="legend" x="20" y="21">CRC (8-bit)</text>

    <rect class="field-addr" x="160" y="10" width="14" height="14" rx="2"/>
    <text class="legend" x="180" y="21">Address</text>

    <rect class="field-rw" x="300" y="10" width="14" height="14" rx="2"/>
    <text class="legend" x="320" y="21">R/W bit</text>

    <rect class="field-data" x="430" y="10" width="14" height="14" rx="2"/>
    <text class="legend" x="450" y="21">Data (16-bit)</text>

    <!-- Row 2 -->
    <rect class="field-stat" x="0" y="32" width="14" height="14" rx="2"/>
    <text class="legend" x="20" y="43">Reply Mode / Status</text>

    <rect class="field-fault" x="220" y="32" width="14" height="14" rx="2"/>
    <text class="legend" x="240" y="43">Fault Flags</text>

    <rect class="frame" x="400" y="32" width="14" height="14" rx="2"/>
    <text class="legend" x="420" y="43">Don&#39;t Care / reserved</text>
  </g>

  <!-- ========================================================= -->
  <!-- Notes                                                      -->
  <!-- ========================================================= -->
  <g>
    <text class="smallL" x="44" y="474">&#8226; All frames are 32 bits, MSB first (bit 31 transmitted first).</text>
    <text class="smallL" x="44" y="488">&#8226; CRC-8 SAE J1850 over bits [23:0]: poly 0x1D, init 0xFF, XOR-out 0xFF; byte order frame[7:0], [15:8], [23:16] (datasheet Rev 1.2 &#167;5.1.2).</text>
    <text class="smallL" x="44" y="502">&#8226; MISO reply mode 00 = normal data reply; mode 10 = critical fault report.</text>
    <text class="smallL" x="44" y="516">&#8226; Fault flags are active-low: 0 = fault condition present.</text>
  </g>
</svg>
