# ESP32 TLE92466ED Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"

metadata:
  project: "ESP32 TLE92466ED Driver Examples"
  default_app: "driver_integration_test"
  # ESP32-S3 reference board:
  #   SPI3_HOST  MISO=GPIO35  MOSI=GPIO37  SCLK=GPIO36  CS=GPIO4
  #   RESN=GPIO6  EN=GPIO5  FAULTN=GPIO16  DRV0=GPIO7  DRV1=GPIO15
  #   ADC = GPIO1 (ADC1_CH0; only used by solenoid_control_test)
  # See main/esp32_tle92466ed_test_config.hpp for the full pin map.
  target: "esp32s3"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # --------------------------------------------------------------------------
  # Driver Integration Test Suite
  # --------------------------------------------------------------------------
  driver_integration_test:
    description: "Comprehensive driver integration test suite (no hardware required)"
    source_file: "driver_integration_test.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "docs/readme_driver_integration_test.md"
    test_sections:
      - "INITIALIZATION_TESTS"
      - "MODE_CONTROL_TESTS"
      - "GLOBAL_CONFIGURATION_TESTS"
      - "CHANNEL_CONTROL_TESTS"
      - "CURRENT_CONTROL_TESTS"
      - "PWM_CONFIGURATION_TESTS"
      - "DITHER_CONFIGURATION_TESTS"
      - "DIAGNOSTICS_TESTS"
      - "FAULT_MANAGEMENT_TESTS"
      - "WATCHDOG_TESTS"
      - "GPIO_CONTROL_TESTS"
      - "MULTI_CHANNEL_TESTS"
      - "PARALLEL_OPERATION_TESTS"
      - "ERROR_CONDITION_TESTS"
    features:
      - "Complete driver API validation (40+ tests)"
      - "13 test sections covering all functionality"
      - "Initialization, configuration, control, diagnostics"
      - "Multi-channel and parallel operation testing"
      - "Error condition validation"
      - "FreeRTOS task-based test execution"
      - "GPIO14 progress indicator"
      - "Automatic pass/fail tracking"
      - "No actual solenoids required (driver test only)"

  # --------------------------------------------------------------------------
  # Parker LM-Pro 24V proportional cycle test (single channel, real hw)
  # --------------------------------------------------------------------------
  lm_pro_cycle_test:
    description: "Cycle a Parker LM-Pro 24V proportional valve on TLE92466ED CH5 (full-flow ramp + diagnostics)"
    source_file: "lm_pro_cycle_test.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    documentation: "docs/readme_solenoid_control_test.md"
    hardware_required: true
    features:
      - "Single LM-Pro coil on CH5 (datasheet: 148 Ω, 115 mA full-flow, 5 kHz PWM)"
      - "Triangle-wave current ramp 0 → 115 → 0 mA in 10 mA steps"
      - "10 Hz per-channel telemetry (setpoint vs avg current, duty, OC/SG/OL/OT)"
      - "1 Hz device-status snapshot (vbat/vio/vdd, ot warnings, init/cfg flags)"
      - "10 s full FaultReport scrape (every flag printed)"
      - "Safety cap at 130 mA above the datasheet full-flow"

  # --------------------------------------------------------------------------
  # Solenoid Control Test (Real Hardware)
  # --------------------------------------------------------------------------
  solenoid_control_test:
    description: "Real hardware solenoid control test with ADC-based current control"
    source_file: "solenoid_control_test.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    documentation: "docs/readme_solenoid_control_test.md"
    hardware_required: true
    features:
      - "Two solenoids: one single channel, one parallel pair"
      - "ADC-based current control (0-3.3V maps to 0-100% current)"
      - "Independent min/max current limits per solenoid"
      - "Real-time current adjustment based on ADC reading"
      - "Proper parallel channel operation validation"
      - "Real hardware testing with actual solenoids"
      - "Continuous monitoring and diagnostics"

  # --------------------------------------------------------------------------
  # Resistive-Load Bench (300 Ω on CH0) - Phase 7
  # --------------------------------------------------------------------------
  resistive_load_bench:
    description: "300 Ω resistive bench: ICC setpoint sweep + atomic feedback verification"
    source_file: "resistive_load_bench.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    hardware_required: true
    documentation: "docs/README_RESISTIVE_LOAD_BENCH.md"
    features:
      - "300 Ω power resistor on CH0, VBAT ≈ 12 V (theoretical 40 mA max)"
      - "Sweeps ICC setpoint 5…40 mA in 5 mA steps"
      - "Uses atomic ReadChannelFeedback() (FB_FRZ/FB_UPD) for coherent snapshots"
      - "Validates ±2.5 mA accuracy at each step"
      - "Reports VBAT, duty cycle, IMIN/IMAX alongside the average current"

  # --------------------------------------------------------------------------
  # Diagnostics + BIST example - Phase 7
  # --------------------------------------------------------------------------
  diagnostics_and_bist:
    description: "SFF_BIST, PIN_STAT, FAULT_MASK, supply-monitor self-test"
    source_file: "diagnostics_and_bist.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug"]
    ci_enabled: true
    featured: false
    hardware_required: false
    documentation: "docs/README_DIAGNOSTICS_AND_BIST.md"
    features:
      - "Exercises RunSffBist()"
      - "Reads PIN_STAT snapshot and OperationState"
      - "Runs RunSupplyMonitorSelfTest() (UV/OV swap, V1V5 UV/OV, OT_TEST)"
      - "Demonstrates SetFaultMask() to toggle FAULTN contribution"

# ============================================================================
# BUILD CONFIGURATION (ESP-IDF Standard Build Types)
# ============================================================================

build_config:
  # Standard ESP-IDF/CMake build types
  # These match CMAKE_BUILD_TYPE values in ESP-IDF
  build_types:
    Debug:
      description: "Debug build with symbols, verbose logging, assertions"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG", "TLE92466ED_DEBUG"]

    Release:
      description: "Release build optimized for performance"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG", "TLE92466ED_RELEASE"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tle92466ed_{app_type}_app"

ci_config:
  # CI build timeout
  timeout_minutes: 30
  # Fail fast on first error
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []
