###############################################################################
# TLE92466ED Driver – ESP-IDF Component Manifest
###############################################################################

name: hf-tle92466ed-driver
version: "2.0.0"
description: |
  Hardware-agnostic TLE92466ED Six-Channel Low-Side Solenoid Driver.
  Modern C++20 with SPI interface, 15-bit precision current control,
  CRC-8, and comprehensive diagnostics.

url: "https://github.com/N3b3x/hf-tle92466ed-driver"
repository: "https://github.com/N3b3x/hf-tle92466ed-driver.git"
documentation: "https://n3b3x.github.io/hf-tle92466ed-driver/"
issues: "https://github.com/N3b3x/hf-tle92466ed-driver/issues"

license: "GPL-3.0"
maintainers:
  - "HardFOC"

targets:
  - esp32
  - esp32c6
  - esp32s3
  - esp32c3

dependencies:
  idf: ">=5.0.0"

tags:
  - "tle92466ed"
  - "infineon"
  - "solenoid"
  - "driver"
  - "spi"
  - "current-control"
  - "cpp23"
  - "hardware-agnostic"
